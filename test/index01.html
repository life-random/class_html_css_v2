<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <span class="logo">
        <a>BRAND</a>
        <a>LOGO</a>
      </span>

      <nav class="navigoter-set">
        <span class="navigoter">소개</span>
        <span class="navigoter">서비스</span>
        <span class="navigoter">문의하기</span>
      </nav>
    </header>

    <main>
      <section class="slogan">
        <h1>더 나은 미래를 만드는 혁신</h1>
        <p>우리는 가장 단순한 방법으로 최고의 가치를 전달합니다.</p>
      </section>

      <section class="card-set">
        <div class="card">
          <p>🚀</p>
          <h2>빠른 속도</h2>
          <span>최신 기술을 활용하여 가장 빠른 퍼포먼스를 보장합니다</span>
        </div>
        <div class="card">
          <p>💎</p>
          <h2>높은 품질</h2>
          <span>정교한 코드와 디자인으로 최상의 결과물을 제공합니다</span>
        </div>
        <div class="card">
          <p>🤝</p>
          <h2>고객 신뢰</h2>
          <span>언제나 고객의 목소리에 귀 기울이며 함께 성장합니다</span>
        </div>
      </section>
    </main>

    <footer>
      <p>@ 2026 Brand Design. All rights reserved.</p>
    </footer>
  </body>
</html>
